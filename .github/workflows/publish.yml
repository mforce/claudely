name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (e.g. latest, next)'
        required: false
        default: 'latest'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1. Node 24 already
      # ships npm 11.x; the explicit pin keeps publishes reproducible — bump
      # deliberately rather than tracking @latest.
      - run: npm install -g npm@11.13.0

      - run: npm ci
      - run: npm run build
      - run: npm run smoke

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish (release)
        if: github.event_name == 'release'
        run: npm publish --access public

      - name: Publish (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          DIST_TAG: ${{ inputs.tag }}
        run: npm publish --access public --tag "$DIST_TAG"
